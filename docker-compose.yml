services:
  postgres:
    image: postgres:17-alpine   # pin the major version to avoid breaking changes
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?not set - see README}
    volumes: ["litellm_db:/var/lib/postgresql/data"]
    networks: [db_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      retries: 5
      start_period: 30s   # first start creates the database before accepting connections

  litellm:
    image: ghcr.io/berriai/litellm:v1.100.3
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Provider keys are passed through only if set; add any used in litellm/config.yaml
    environment:
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:?not set - see Step 4}
      AZURE_FOUNDRY_API_BASE: ${AZURE_FOUNDRY_API_BASE:?not set - see Step 4}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?not set - see Step 4}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    networks: [egress_net, db_net]   # only the host (Inspect) calls the gateway
    ports: ["127.0.0.1:4000:4000"]

  litmcp:
    build: ./litmcp
    environment:
      S2_API_KEY: ${S2_API_KEY:-}
    volumes: ["./litmcp/cache:/cache"]
    networks: [sandbox_net, egress_net]
    # Only what entrypoint.sh needs to hand /cache to the right user and drop root
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]

  pypiserver:
    image: pypiserver/pypiserver:v2.4.2
    # Bypasses entrypoint.sh, which demands write access to the read-only wheelhouse
    entrypoint: ["pypi-server"]
    user: "9898:9898"
    command: ["run", "-p", "8080", "--disable-fallback", "/data/packages"]
    volumes: ["./pypi/wheelhouse:/data/packages:ro"]
    networks: [sandbox_net]      # serves only the wheelhouse; no egress
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  sandbox_net:
    name: aura_sandbox   # fixed, so agent/compose.yaml can join it
    internal: true
  egress_net: {}
  db_net: {internal: true}

volumes:
  litellm_db: {}
