services:
  agent:
    image: research-sandbox:${AGENT_TAG:?not set in .env}
    build: ./agent
    profiles: ["run"]            # the agent is not started by 'docker compose up -d'; only by `aura run`
    networks: [sandbox_net]      # no internet route
    environment:
      ANTHROPIC_BASE_URL: http://litellm:4000
      ANTHROPIC_AUTH_TOKEN: ${RUN_KEY}
      ANTHROPIC_MODEL: ${RUN_MODEL}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${RUN_MODEL}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${RUN_MODEL}
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${RUN_KEY}
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      NO_PROXY: litellm,litmcp
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      OPENCODE_DISABLE_CLAUDE_CODE: "1"
    volumes:
      - ./skills:/skills:ro
      - ${RUN_DIR}/workspace:/workspace
      - ${RUN_DIR}/task:/task:ro
    cpus: 4
    mem_limit: 16g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17-alpine   # pin the major version to avoid breaking changes
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?not set - see README}
    volumes: ["litellm_db:/var/lib/postgresql/data"]
    networks: [db_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      retries: 5
      start_period: 30s   # first start creates the database before accepting connections

  litellm:
    image: ghcr.io/berriai/litellm:v1.100.3
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Provider keys are passed through only if set; add any used in litellm/config.yaml
    environment:
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:?not set - see Step 4}
      AZURE_FOUNDRY_API_BASE: ${AZURE_FOUNDRY_API_BASE:?not set - see Step 4}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?not set - see Step 4}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    networks: [sandbox_net, egress_net, db_net]
    ports: ["127.0.0.1:4000:4000"]

  litmcp:
    build: ./litmcp
    environment:
      S2_API_KEY: ${S2_API_KEY:-}
    volumes: ["./litmcp/cache:/cache"]
    networks: [sandbox_net, egress_net]
    # Only what entrypoint.sh needs to hand /cache to the right user and drop root
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]

  proxy:
    image: ubuntu/squid:7.2-26.04_edge
    volumes: ["./proxy/squid.conf:/etc/squid/squid.conf:ro"]
    networks: [sandbox_net, egress_net]

networks:
  sandbox_net:
    internal: true
  egress_net: {}
  db_net: {internal: true}

volumes:
  litellm_db: {}
